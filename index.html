<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>КАДР — кинотеатр</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--bg:#08090d;--panel:#161921;--text:#f6f6f8;--muted:#9b9da8;--accent:#d6ff67}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.015em}header{position:sticky;top:0;z-index:5;background:#08090de8;backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-between;padding:17px max(22px,calc((100vw - 1220px)/2));border-bottom:1px solid #ffffff0b}h1{margin:0;color:#fff;letter-spacing:.16em;font-size:23px;font-weight:900}header .muted{font-size:12px;letter-spacing:.12em;text-transform:uppercase}main{max-width:1240px;margin:auto;padding:22px 22px 115px}.muted{color:var(--muted)}button,input,select,textarea{font:inherit}button{background:#24262e;border:1px solid #ffffff12;border-radius:12px;color:var(--text);padding:12px 17px;cursor:pointer;transition:transform .2s,background .2s}button:active{transform:scale(.96)}button.active,.primary{background:var(--accent);color:#11150a;border-color:var(--accent);font-weight:750}input,select,textarea{background:#1b1d26;color:var(--text);border:1px solid #ffffff18;border-radius:13px;padding:14px;width:100%}.hero{min-height:440px;border-radius:23px;padding:clamp(28px,6vw,70px);background:linear-gradient(90deg,#08090deb 0%,#08090d83 54%,#08090d20 100%),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600&q=85') center/cover;margin:8px 0 38px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;box-shadow:0 20px 80px #0008}.hero span{color:var(--accent);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px}.hero h2{font-size:clamp(38px,6vw,76px);line-height:1.02;max-width:650px;margin:14px 0;font-weight:850;letter-spacing:-.06em}.hero p{max-width:480px;line-height:1.65;color:#e0e1e5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:19px}.tile{border:0;border-radius:14px;background:transparent;overflow:hidden;cursor:pointer;transition:transform .22s}.tile:hover{transform:translateY(-6px)}.poster{height:265px;display:flex;align-items:center;justify-content:center;font-size:0;background:linear-gradient(145deg,#34404e,#1c2531);border-radius:13px;position:relative;overflow:hidden}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0007,transparent 50%)}.tile .info{padding:12px 2px}.info strong{display:block;font-size:15px;font-weight:650}.info small{display:block;color:var(--muted);margin-top:6px;font-size:12px}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;gap:4px;padding:7px;background:#202229e8;backdrop-filter:blur(25px);border:1px solid #ffffff20;border-radius:23px;box-shadow:0 12px 45px #000b;z-index:6;width:min(94%,560px)}nav button{font-size:12px;padding:12px 8px;flex:1;border:0;background:transparent;border-radius:17px}nav button.active{background:#e8ebef;color:#15171b}section{margin-bottom:32px}h2{font-size:24px;letter-spacing:-.035em;margin:34px 0 20px}.toolbar{display:flex;gap:10px;margin-bottom:24px}.toolbar>*{flex:1}dialog{max-width:650px;width:calc(100% - 28px);border:1px solid #ffffff24;border-radius:23px;background:#17191f;color:white;padding:25px}dialog::backdrop{background:#000c;backdrop-filter:blur(9px)}.close{float:right}video{width:100%;border-radius:12px;background:#000}#empty{padding:35px;color:var(--muted)}form{display:grid;gap:10px;max-width:700px}@media(max-width:600px){main{padding:14px 16px 110px}.hero{min-height:420px;border-radius:17px;padding:27px;background-position:55% center}.hero h2{font-size:44px}.poster{height:235px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.toolbar{flex-direction:column}nav button{font-size:10px;padding:12px 3px}header{padding:15px 18px}}</style></head><body><header><h1>КАДР</h1><span class="muted">Твой кинотеатр 🎬</span></header><main id="app"></main><nav><button onclick="page='home';render()">🏠 Главная</button><button onclick="page='catalog';render()">🎞️ Каталог</button><button onclick="page='favorites';render()">♥ Избранное</button><button onclick="page='iptv';render()">📺 IPTV</button><button onclick="page='settings';render()">⚙️ Настройки</button></nav><dialog id="detail"><button class="close" onclick="detail.close()">✕</button><div id="detailBody"></div></dialog><script>
const movies=[['Путешествие к звёздам','Фантастика','🚀',2024],['Тайна старого дома','Детектив','🏚️',2023],['Город дождя','Драма','🌧️',2025],['Последний маяк','Приключения','🌊',2022],['Зимний экспресс','Триллер','🚆',2024],['Лесная история','Семейный','🌲',2025],['За горизонтом','Фантастика','🪐',2023],['Солнечный день','Комедия','☀️',2024],['Вечерний джаз','Драма','🎷',2022],['Тени прошлого','Детектив','🕯️',2025],['Океан зовёт','Приключения','🐋',2024],['Маленький робот','Семейный','🤖',2023]].map((m,i)=>({id:i,title:m[0],genre:m[1],emoji:m[2],year:m[3]}));
let page='home',q='',genre='Все',favs=JSON.parse(localStorage.getItem('kadr-favs')||'[]'),channels=JSON.parse(localStorage.getItem('kadr-channels')||'[]');
const app=document.getElementById('app'),detail=document.getElementById('detail');
function save(){localStorage.setItem('kadr-favs',JSON.stringify(favs));localStorage.setItem('kadr-channels',JSON.stringify(channels))}
const photos=["photo-1440404653325-ab127d49abc1","photo-1517604931442-7e0c8ed2963c","photo-1478720568477-152d9b164e26","photo-1485846234645-a62644f84728","photo-1574375927938-d5a98e8ffe85","photo-1514306191717-452ec28c7814","photo-1500530855697-b586d89ba3ee","photo-1534447677768-be436bb09401","photo-1518709268805-4e9042af9f23","photo-1503095396549-807759245b35","photo-1451187580459-43490279c0fa","photo-1492684223066-81342ee5ff30"];function card(m){return '<article class="tile" onclick="show('+m.id+')"><div class="poster">'+m.emoji+'</div><div class="info"><strong>'+m.title+'</strong><small>'+m.genre+' · '+m.year+'</small></div></article>'}
function cards(a){return a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<p id="empty">Здесь пока ничего нет.</p>'}
function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['home','catalog','favorites','iptv','settings'][i]===page));
if(page==='home')app.innerHTML='<div class="hero"><span>Добро пожаловать</span><h2>Кино начинается здесь</h2><p>Демонстрационный каталог. Для просмотра добавляй разрешённые видеоисточники.</p><button class="primary" onclick="page=\'catalog\';render()">Открыть каталог</button></div><h2>Рекомендуем</h2>'+cards(movies.slice(0,6))+'<h2>Ещё посмотреть</h2>'+cards(movies.slice(6));
if(page==='catalog')app.innerHTML='<h2>Каталог</h2><div class="toolbar"><input id="search" placeholder="Поиск фильма" value="'+q.replaceAll('"','&quot;')+'" oninput="q=this.value;drawCatalog()"><select onchange="genre=this.value;drawCatalog()">'+['Все',...new Set(movies.map(m=>m.genre))].map(g=>'<option '+(g===genre?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div id="results"></div>';if(page==='catalog')drawCatalog();
if(page==='favorites')app.innerHTML='<h2>Избранное</h2>'+cards(movies.filter(m=>favs.includes(m.id)));
if(page==='iptv')app.innerHTML='<h2>IPTV</h2><p class="muted">Добавляй свои телеканалы с законными прямыми ссылками на потоки. Поддержка зависит от браузера и формата.</p><form onsubmit="addChannel(event)"><input id="chname" placeholder="Название канала" required><input id="churl" type="url" placeholder="https://.../stream.m3u8" required><button class="primary">Добавить канал</button></form><h3>Мои каналы</h3><div id="channels"></div><h3>Плеер</h3><video id="player" controls playsinline></video>';if(page==='iptv')drawChannels();
if(page==='settings')app.innerHTML='<h2>Настройки</h2><p>Тема оформления</p><button onclick="document.documentElement.style.setProperty(\'--accent\',\'#72e5ba\')">Мятная</button> <button onclick="document.documentElement.style.setProperty(\'--accent\',\'#ffa36b\')">Оранжевая</button> <button onclick="document.documentElement.style.setProperty(\'--accent\',\'#bba6ff\')">Фиолетовая</button><p class="muted">КАДР v1 — демонстрационная версия. Каталог вымышленный, видео не предоставляются.</p>'}
function drawCatalog(){document.getElementById('results').innerHTML=cards(movies.filter(m=>(genre==='Все'||m.genre===genre)&&m.title.toLowerCase().includes(q.toLowerCase())))}
function show(id){const m=movies[id];document.getElementById('detailBody').innerHTML='<div class="poster" style="height:260px;background:url(https://images.unsplash.com/'+photos[m.id]+'?w=900&q=85) center/cover">'+m.emoji+'</div><h2>'+m.title+'</h2><p>'+m.genre+' · '+m.year+'</p><p>Демонстрационная карточка фильма. Для реального просмотра потребуется лицензированный источник видео.</p><button class="primary" onclick="toggle('+id+')">'+(favs.includes(id)?'Убрать из избранного':'♥ В избранное')+'</button>';detail.showModal()}
function toggle(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();detail.close();render()}
function addChannel(e){e.preventDefault();channels.push({name:document.getElementById('chname').value,url:document.getElementById('churl').value});save();render()}
function drawChannels(){document.getElementById('channels').innerHTML=channels.length?channels.map((c,i)=>'<p><button onclick="play('+i+')">▶ '+c.name.replaceAll('<','&lt;')+'</button> <button onclick="removeChannel('+i+')">Удалить</button></p>').join(''):'<p class="muted">Каналов пока нет</p>'}
function play(i){document.getElementById('player').src=channels[i].url;document.getElementById('player').play().catch(()=>{})}
function removeChannel(i){channels.splice(i,1);save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
