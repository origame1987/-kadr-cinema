<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>КАДР — кинотеатр</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#090b10;--panel:#1b202a;--text:#f5f6f9;--muted:#a2aab9;--accent:#72e5ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#090b10ee;display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid #303440}h1{margin:0;color:var(--accent);letter-spacing:.2em;font-size:24px}main{max-width:1100px;margin:auto;padding:22px 18px 95px}.muted{color:var(--muted)}button,input,select,textarea{font:inherit}button{background:var(--panel);border:1px solid #38404e;border-radius:12px;color:var(--text);padding:11px 15px;cursor:pointer}button.active,.primary{background:var(--accent);color:#07130f;border-color:var(--accent)}input,select,textarea{background:var(--panel);color:var(--text);border:1px solid #3a4050;border-radius:10px;padding:12px;width:100%}.hero{border-radius:20px;padding:32px;background:linear-gradient(125deg,#164c46,#25253c);margin:8px 0 28px}.hero h2{font-size:34px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px}.tile{border:1px solid #323744;border-radius:16px;background:var(--panel);overflow:hidden;cursor:pointer}.poster{height:220px;display:flex;align-items:center;justify-content:center;font-size:55px;background:linear-gradient(145deg,#34404e,#1c2531)}.info{padding:12px}.info strong{display:block}.info small{color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:10px;background:#11151cf7;border-top:1px solid #343945;z-index:3}nav button{font-size:13px;padding:10px;flex:1;max-width:160px}section{margin-bottom:28px}.toolbar{display:flex;gap:8px;margin-bottom:18px}.toolbar>*{flex:1}dialog{max-width:650px;width:calc(100% - 28px);border:1px solid #424a59;border-radius:20px;background:#151a24;color:white;padding:25px}dialog::backdrop{background:#000b}.close{float:right}video{width:100%;border-radius:12px;background:#000}#empty{padding:35px;color:var(--muted)}@media(max-width:500px){.poster{height:185px}.grid{grid-template-columns:repeat(2,1fr)}nav button{font-size:11px;padding:9px 4px}}
</style></head><body><header><h1>КАДР</h1><span class="muted">Твой кинотеатр 🎬</span></header><main id="app"></main><nav><button onclick="page='home';render()">🏠 Главная</button><button onclick="page='catalog';render()">🎞️ Каталог</button><button onclick="page='favorites';render()">♥ Избранное</button><button onclick="page='iptv';render()">📺 IPTV</button><button onclick="page='settings';render()">⚙️ Настройки</button></nav><dialog id="detail"><button class="close" onclick="detail.close()">✕</button><div id="detailBody"></div></dialog><script>
const movies=[['Путешествие к звёздам','Фантастика','🚀',2024],['Тайна старого дома','Детектив','🏚️',2023],['Город дождя','Драма','🌧️',2025],['Последний маяк','Приключения','🌊',2022],['Зимний экспресс','Триллер','🚆',2024],['Лесная история','Семейный','🌲',2025],['За горизонтом','Фантастика','🪐',2023],['Солнечный день','Комедия','☀️',2024],['Вечерний джаз','Драма','🎷',2022],['Тени прошлого','Детектив','🕯️',2025],['Океан зовёт','Приключения','🐋',2024],['Маленький робот','Семейный','🤖',2023]].map((m,i)=>({id:i,title:m[0],genre:m[1],emoji:m[2],year:m[3]}));
let page='home',q='',genre='Все',favs=JSON.parse(localStorage.getItem('kadr-favs')||'[]'),channels=JSON.parse(localStorage.getItem('kadr-channels')||'[]');
const app=document.getElementById('app'),detail=document.getElementById('detail');
function save(){localStorage.setItem('kadr-favs',JSON.stringify(favs));localStorage.setItem('kadr-channels',JSON.stringify(channels))}
function card(m){return '<article class="tile" onclick="show('+m.id+')"><div class="poster">'+m.emoji+'</div><div class="info"><strong>'+m.title+'</strong><small>'+m.genre+' · '+m.year+'</small></div></article>'}
function cards(a){return a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<p id="empty">Здесь пока ничего нет.</p>'}
function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['home','catalog','favorites','iptv','settings'][i]===page));
if(page==='home')app.innerHTML='<div class="hero"><span>Добро пожаловать</span><h2>Истории начинаются здесь</h2><p>Демонстрационный каталог. Для просмотра добавляй разрешённые видеоисточники.</p><button class="primary" onclick="page=\'catalog\';render()">Открыть каталог</button></div><h2>Рекомендуем</h2>'+cards(movies.slice(0,6))+'<h2>Ещё посмотреть</h2>'+cards(movies.slice(6));
if(page==='catalog')app.innerHTML='<h2>Каталог</h2><div class="toolbar"><input id="search" placeholder="Поиск фильма" value="'+q.replaceAll('"','&quot;')+'" oninput="q=this.value;drawCatalog()"><select onchange="genre=this.value;drawCatalog()">'+['Все',...new Set(movies.map(m=>m.genre))].map(g=>'<option '+(g===genre?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div id="results"></div>';if(page==='catalog')drawCatalog();
if(page==='favorites')app.innerHTML='<h2>Избранное</h2>'+cards(movies.filter(m=>favs.includes(m.id)));
if(page==='iptv')app.innerHTML='<h2>IPTV</h2><p class="muted">Добавляй свои телеканалы с законными прямыми ссылками на потоки. Поддержка зависит от браузера и формата.</p><form onsubmit="addChannel(event)"><input id="chname" placeholder="Название канала" required><input id="churl" type="url" placeholder="https://.../stream.m3u8" required><button class="primary">Добавить канал</button></form><h3>Мои каналы</h3><div id="channels"></div><h3>Плеер</h3><video id="player" controls playsinline></video>';if(page==='iptv')drawChannels();
if(page==='settings')app.innerHTML='<h2>Настройки</h2><p>Тема оформления</p><button onclick="document.documentElement.style.setProperty(\'--accent\',\'#72e5ba\')">Мятная</button> <button onclick="document.documentElement.style.setProperty(\'--accent\',\'#ffa36b\')">Оранжевая</button> <button onclick="document.documentElement.style.setProperty(\'--accent\',\'#bba6ff\')">Фиолетовая</button><p class="muted">КАДР v1 — демонстрационная версия. Каталог вымышленный, видео не предоставляются.</p>'}
function drawCatalog(){document.getElementById('results').innerHTML=cards(movies.filter(m=>(genre==='Все'||m.genre===genre)&&m.title.toLowerCase().includes(q.toLowerCase())))}
function show(id){const m=movies[id];document.getElementById('detailBody').innerHTML='<div class="poster" style="height:150px">'+m.emoji+'</div><h2>'+m.title+'</h2><p>'+m.genre+' · '+m.year+'</p><p>Демонстрационная карточка фильма. Для реального просмотра потребуется лицензированный источник видео.</p><button class="primary" onclick="toggle('+id+')">'+(favs.includes(id)?'Убрать из избранного':'♥ В избранное')+'</button>';detail.showModal()}
function toggle(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();detail.close();render()}
function addChannel(e){e.preventDefault();channels.push({name:document.getElementById('chname').value,url:document.getElementById('churl').value});save();render()}
function drawChannels(){document.getElementById('channels').innerHTML=channels.length?channels.map((c,i)=>'<p><button onclick="play('+i+')">▶ '+c.name.replaceAll('<','&lt;')+'</button> <button onclick="removeChannel('+i+')">Удалить</button></p>').join(''):'<p class="muted">Каналов пока нет</p>'}
function play(i){document.getElementById('player').src=channels[i].url;document.getElementById('player').play().catch(()=>{})}
function removeChannel(i){channels.splice(i,1);save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
