:14px}.toolbar{flex-direction:column}nav button{font-size:10px;padding:12px 3px}header{padding:15px 18px}}</style><style id="kadr-v6-style">

</style></head><body><header><h1>КАДР</h1><span class="muted">Твой кинотеатр 🎬</span></header><main id="app"></main><nav><button onclick="page='home';render()">🏠 Главная</button><button onclick="page='catalog';render()">🎞️ Каталог</button><button onclick="page='favorites';render()">♥ Избранное</button><button onclick="page='iptv';render()">📺 IPTV</button><button onclick="page='settings';render()">⚙️ Настройки</button></nav><dialog id="detail"><button class="close" onclick="detail.close()">✕</button><div id="detailBody"></div></dialog><script>
const movies=[['Путешествие к звёздам','Фантастика','🚀',2024],['Тайна старого дома','Детектив','🏚️',2023],['Город дождя','Драма','🌧️',2025],['Последний маяк','Приключения','🌊',2022],['Зимний экспресс','Триллер','🚆',2024],['Лесная история','Семейный','🌲',2025],['За горизонтом','Фантастика','🪐',2023],['Солнечный день','Комедия','☀️',2024],['Вечерний джаз','Драма','🎷',2022],['Тени прошлого','Детектив','🕯️',2025],['Океан зовёт','Приключения','🐋',2024],['Маленький робот','Семейный','🤖',2023]].map((m,i)=>({id:i,title:m[0],genre:m[1],emoji:m[2],year:m[3]}));
let page='home',q='',genre='Все',favs=JSON.parse(localStorage.getItem('kadr-favs')||'[]'),channels=JSON.parse(localStorage.getItem('kadr-channels')||'[]');
const app=document.getElementById('app'),detail=document.getElementById('detail');
function save(){localStorage.setItem('kadr-favs',JSON.stringify(favs));localStorage.setItem('kadr-channels',JSON.stringify(channels))}
const photos=["photo-1440404653325-ab127d49abc1","photo-1517604931442-7e0c8ed2963c","photo-1478720568477-152d9b164e26","photo-1485846234645-a62644f84728","photo-1574375927938-d5a98e8ffe85","photo-1514306191717-452ec28c7814","photo-1500530855697-b586d89ba3ee","photo-1534447677768-be436bb09401","photo-1518709268805-4e9042af9f23","photo-1503095396549-807759245b35","photo-1451187580459-43490279c0fa","photo-1492684223066-81342ee5ff30"];function card(m){return '<article class="tile" onclick="show('+m.id+')"><div class="poster">'+m.emoji+'</div><div class="info"><strong>'+m.title+'</strong><small>'+m.genre+' · '+m.year+'</small></div></article>'}
function cards(a){return a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<p id="empty">Здесь пока ничего нет.</p>'}
function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['home','catalog','favorites','iptv','settings'][i]===page));
if(page==='home')app.innerHTML='<div class="hero"><span>Добро пожаловать</span><h2>Кино начинается здесь</h2><p>Демонстрационный каталог. Для просмотра добавляй разрешённые видеоисточники.</p><button class="primary" onclick="page=\'catalog\';render()">Открыть каталог</button></div><h2>Рекомендуем</h2>'+cards(movies.slice(0,6))+'<h2>Ещё посмотреть</h2>'+cards(movies.slice(6));
if(page==='catalog')app.innerHTML='<h2>Каталог</h2><div class="toolbar"><input id="search" placeholder="Поиск фильма" value="'+q.replaceAll('"','&quot;')+'" oninput="q=this.value;drawCatalog()"><select onchange="genre=this.value;drawCatalog()">'+['Все',...new Set(movies.map(m=>m.genre))].map(g=>'<option '+(g===genre?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div id="results"></div>';if(page==='catalog')drawCatalog();
if(page==='favorites')app.innerHTML='<h2>Избранное</h2>'+cards(movies.filter(m=>favs.includes(m.id)));
if(page==='iptv')app.innerHTML='<h2>IPTV</h2><p class="muted">Добавляй свои телеканалы с законными прямыми ссылками на потоки. Поддержка зависит от браузера и формата.</p><form onsubmit="addChannel(event)"><input id="chname" placeholder="Название канала" required><input id="churl" type="url" placeholder="https://.../stream.m3u8" required><button class="primary">Добавить канал</button></form><h3>Мои каналы</h3><div id="channels"></div><h3>Плеер</h3><video id="player" controls playsinline></video>';if(page==='iptv')drawChannels();
if(page==='settings')app.innerHTML='<h2>Настройки</h2><p>Тема оформления</p><button onclick="document.documentElement.style.setProperty(\'--accent\',\'#72e5ba\')">Мятная</button> <button onclick="document.documentElement.style.setProperty(\'--accent\',\'#ffa36b\')">Оранжевая</button> <button onclick="document.documentElement.style.setProperty(\'--accent\',\'#bba6ff\')">Фиолетовая</button><p class="muted">КАДР v1 — демонстрационная версия. Каталог вымышленный, видео не предоставляются.</p>'}
function drawCatalog(){document.getElementById('results').innerHTML=cards(movies.filter(m=>(genre==='Все'||m.genre===genre)&&m.title.toLowerCase().includes(q.toLowerCase())))}
function show(id){const m=movies[id];document.getElementById('detailBody').innerHTML='<div class="poster" style="height:260px;background:url(https://images.unsplash.com/'+photos[m.id]+'?w=900&q=85) center/cover">'+m.emoji+'</div><h2>'+m.title+'</h2><p>'+m.genre+' · '+m.year+'</p><p>Демонстрационная карточка фильма. Для реального просмотра потребуется лицензированный источник видео.</p><button class="primary" onclick="toggle('+id+')">'+(favs.includes(id)?'Убрать из избранного':'♥ В избранное')+'</button>';detail.showModal()}
function toggle(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();detail.close();render()}
function addChannel(e){e.preventDefault();channels.push({name:document.getElementById('chname').value,url:document.getElementById('churl').value});save();render()}
function drawChannels(){document.getElementById('channels').innerHTML=channels.length?channels.map((c,i)=>'<p><button onclick="play('+i+')">▶ '+c.name.replaceAll('<','&lt;')+'</button> <button onclick="removeChannel('+i+')">Удалить</button></p>').join(''):'<p class="muted">Каналов пока нет</p>'}
function play(i){document.getElementById('player').src=channels[i].url;document.getElementById('player').play().catch(()=>{})}
function removeChannel(i){channels.splice(i,1);save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script><script>
(function(){
const app=document.getElementById('app'),dialog=document.getElementById('detail'),body=document.getElementById('detailBody');
let shows=[],term='',genre='Все',mode='home',pending=0;
let filmMode=false,films=[],filmLoading=false;
const filmSeeds=[['Interstellar (film)','Интерстеллар',2014,'Фантастика'],['Inception','Начало',2010,'Фантастика'],['The Dark Knight','Тёмный рыцарь',2008,'Боевик'],['The Shawshank Redemption','Побег из Шоушенка',1994,'Драма'],['The Matrix','Матрица',1999,'Фантастика'],['Dune (2021 film)','Дюна',2021,'Фантастика'],['Oppenheimer (film)','Оппенгеймер',2023,'Драма'],['The Grand Budapest Hotel','Отель «Гранд Будапешт»',2014,'Комедия'],['Parasite (2019 film)','Паразиты',2019,'Триллер'],['The Lord of the Rings: The Fellowship of the Ring','Властелин колец: Братство кольца',2001,'Фэнтези'],['Whiplash (2014 film)','Одержимость',2014,'Драма'],['The Truman Show','Шоу Трумана',1998,'Драма'],['Spirited Away','Унесённые призраками',2001,'Анимация'],['Everything Everywhere All at Once','Всё везде и сразу',2022,'Фантастика'],['Blade Runner 2049','Бегущий по лезвию 2049',2017,'Фантастика'],['The Green Mile (film)','Зелёная миля',1999,'Драма']];
async function loadFilms(){if(filmLoading||films.length)return;filmLoading=true;const titles=filmSeeds.map(x=>x[0]).join('|');try{const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=600&exintro=1&explaintext=1&exchars=650&titles='+encodeURIComponent(titles);const r=await fetch(url);if(!r.ok)throw Error(r.status);const json=await r.json();const pages=Object.values(json.query.pages);films=filmSeeds.map((x,i)=>{const p=pages.find(p=>p.title===x[0])||{};return{id:i,title:x[1],year:x[2],genre:x[3],description:p.extract||'Описание пока недоступно.',image:p.thumbnail?.source||'',wiki:'https://en.wikipedia.org/wiki/'+encodeURIComponent(x[0].replaceAll(' ','_'))}})}catch(e){films=filmSeeds.map((x,i)=>({id:i,title:x[1],year:x[2],genre:x[3],description:'Описание временно недоступно.',image:'',wiki:'https://en.wikipedia.org/wiki/'+encodeURIComponent(x[0].replaceAll(' ','_'))}))}filmLoading=false;if(filmMode&&mode!=='iptv'&&mode!=='settings')draw()}
const filmFavorites=()=>JSON.parse(localStorage.getItem('kadr-film-favs')||'[]');
function filmTile(x){return '<article class="tile" data-film="'+x.id+'"><div class="poster" style="'+(x.image?'background:url('+esc(x.image)+') center/cover':'background:linear-gradient(145deg,#273044,#171a22)')+'">'+(x.image?'':'<span style="font-size:36px;color:#b7b9c2;text-align:center;padding:14px">'+esc(x.title)+'</span>')+'</div><div class="info"><strong>'+esc(x.title)+'</strong><small>'+x.year+' · '+esc(x.genre)+'</small></div></article>'}
function filmDetails(id){
const x=films.find(x=>x.id===id);if(!x)return;
const liked=filmFavorites().includes(id);
const trailer='https://www.youtube.com/results?search_query='+encodeURIComponent(x.title+' '+x.year+' официальный трейлер');
body.innerHTML='<div class="film-detail">'+(x.image?'<div class="film-detail-cover" style="background-image:linear-gradient(0deg,#17191f 0%,#17191f00 75%),url(\''+esc(x.image)+'\')"></div>':'')+'<div class="film-detail-content"><span class="eyebrow">КАДР · ФИЛЬМ</span><h2>'+esc(x.title)+'</h2><div class="film-detail-meta"><span>'+x.year+'</span><span>'+esc(x.genre)+'</span></div><p class="film-description">'+esc(x.description)+'</p><div class="film-actions"><a class="film-trailer" href="'+trailer+'" target="_blank" rel="noopener noreferrer">▶ Найти официальный трейлер</a><button id="filmFav" class="film-favorite">'+(liked?'♥ В избранном':'♡ В избранное')+'</button></div><p class="film-disclaimer">Трейлер открывается в поиске YouTube. Доступность официального видео зависит от правообладателя.</p><a class="film-source" href="'+esc(x.wiki)+'" target="_blank" rel="noopener noreferrer">Информация о фильме · Wikipedia ↗</a></div></div>';
dialog.showModal();
document.getElementById('filmFav').onclick=()=>{let a=filmFavorites();a=a.includes(id)?a.filter(v=>v!==id):[...a,id];localStorage.setItem('kadr-film-favs',JSON.stringify(a));dialog.close();draw()};
}
function movieRow(label,items){return '<div class="section-head"><h2>'+label+'</h2><button data-more="films">Все фильмы ›</button></div><div class="cinema-row">'+items.map(filmTile).join('')+'</div>'}
function showRow(label,items){return '<div class="section-head"><h2>'+label+'</h2><button data-more="shows">Все сериалы ›</button></div><div class="cinema-row">'+items.map(tile).join('')+'</div>'}
function drawHome(){const hero=films[0];app.innerHTML='<div class="spotlight" style="'+(hero?.image?'background:linear-gradient(90deg,#08090df0 0%,#08090d77 75%),url('+esc(hero.image)+') center 35%/cover':'')+'"><span class="eyebrow">КАДР · ТВОЯ КОЛЛЕКЦИЯ ИСТОРИЙ</span><h2>Время хорошего кино.</h2><p>Фильмы, сериалы и любимые истории — в одном месте. Выбирай, сохраняй, смотри трейлеры.</p><button class="primary" id="homeExplore">Исследовать каталог</button></div><div class="pill-tabs"><button id="homeFilms" class="active">🎬 Фильмы</button><button id="homeShows">📺 Сериалы</button><button id="homeFav">♥ Избранное</button></div>'+movieRow('Выбор редакции',films.slice(0,9))+showRow('Сериалы, которые обсуждают',shows.slice(0,10))+movieRow('Для вечернего просмотра',films.slice(9))+'<p class="muted" style="font-size:12px;margin-top:32px">Данные о фильмах: Wikipedia / Wikimedia. Сериалы: TVmaze. Видеоконтент не предоставляется.</p>';
const go=(next,asFilms)=>{mode=next;filmMode=asFilms;genre='Все';term='';draw()};
app.querySelector('#homeExplore').onclick=()=>go('catalog',true);
app.querySelector('#homeFilms').onclick=()=>go('catalog',true);
app.querySelector('#homeShows').onclick=()=>go('catalog',false);
app.querySelector('#homeFav').onclick=()=>go('favorites',true);
app.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>go('catalog',b.dataset.more==='films'));
app.querySelectorAll('[data-film]').forEach(el=>el.onclick=()=>filmDetails(Number(el.dataset.film)));
app.querySelectorAll('[data-show]').forEach(el=>el.onclick=()=>details(Number(el.dataset.show)));
}
function drawFilms(){const list=mode==='favorites'?films.filter(x=>filmFavorites().includes(x.id)):films.filter(x=>(genre==='Все'||x.genre===genre)&&x.title.toLowerCase().includes(term.toLowerCase()));const genres=['Все',...new Set(films.map(x=>x.genre))];app.innerHTML=(mode==='home'?'<div class="hero"><span>КАДР · ФИЛЬМЫ</span><h2>Большое кино. Большие истории.</h2><p>Открывай фильмы, изучай сюжеты и находи трейлеры.</p></div>':'<h2>'+(mode==='favorites'?'Избранные фильмы':'Фильмы')+'</h2>')+'<div style="display:flex;gap:8px;margin:0 0 24px"><button id="filmsTab" class="active">🎬 Фильмы</button><button id="showsTab">📺 Сериалы</button></div>'+(mode==='catalog'?'<div class="toolbar"><input id="filmSearch" placeholder="Поиск фильма" value="'+esc(term)+'"><select id="filmGenre">'+genres.map(g=>'<option '+(g===genre?'selected':'')+'>'+esc(g)+'</option>').join('')+'</select></div>':'')+(mode==='home'?'<h2>Подборка фильмов</h2>':'')+'<div class="grid">'+list.map(filmTile).join('')+'</div>'+(list.length?'':'<p class="muted">Фильмы не найдены.</p>')+'<p class="muted" style="font-size:12px;margin-top:35px">Сведения и изображения: Wikipedia / Wikimedia. Постеры могут быть недоступны. Трейлер открывается через поиск YouTube. Видеофильмы не предоставляются.</p>';
app.querySelector('#showsTab').onclick=()=>{filmMode=false;genre='Все';term='';draw()};
app.querySelectorAll('[data-film]').forEach(el=>el.onclick=()=>filmDetails(Number(el.dataset.film)));
if(app.querySelector('#filmSearch'))app.querySelector('#filmSearch').oninput=e=>{term=e.target.value;const pos=e.target.selectionStart;draw();const n=app.querySelector('#filmSearch');n.focus();n.setSelectionRange(pos,pos)};
if(app.querySelector('#filmGenre'))app.querySelector('#filmGenre').onchange=e=>{genre=e.target.value;draw()};
}

const clean=t=>String(t||'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"');
const esc=t=>clean(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const favorites=()=>JSON.parse(localStorage.getItem('kadr-show-favs')||'[]');
function tile(x){return '<article class="tile" data-show="'+x.id+'"><div class="poster" style="background:'+ (x.image?'url('+x.image.medium+') center/cover':'linear-gradient(130deg,#222,#333)')+'"></div><div class="info"><strong>'+esc(x.name)+'</strong><small>★ '+(x.rating.average||'—')+' · '+esc((x.genres||[]).slice(0,2).join(', ')||'Сериал')+'</small></div></article>'}
function draw(){if(mode==='home' && (films.length||shows.length)){window.page=mode;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===0));drawHome();return}if(filmMode && mode!=='iptv' && mode!=='settings'){window.page=mode;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['home','catalog','favorites','iptv','settings'][i]===mode));drawFilms();return}window.page=mode;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['home','catalog','favorites','iptv','settings'][i]===mode));if(mode==='iptv'||mode==='settings'){window.render();return}
let list=mode==='favorites'?shows.filter(x=>favorites().includes(x.id)):shows.filter(x=>(genre==='Все'||x.genres.includes(genre))&&x.name.toLowerCase().includes(term.toLowerCase()));
let genres=['Все',...new Set(shows.flatMap(x=>x.genres))];
app.innerHTML=(mode==='home'?'<div class="hero"><span>КАДР ORIGINAL EXPERIENCE</span><h2>Сериалы, которые захватывают</h2><p>Настоящие постеры, рейтинги и описания. Исследуй истории, добавляй любимое в избранное.</p><button class="primary" id="browse">Исследовать каталог</button></div>':'<h2>'+(mode==='favorites'?'Избранное':'Сериалы и шоу')+'</h2>')+(mode==='catalog'?'<div class="toolbar"><input id="showSearch" placeholder="Найти сериал" value="'+esc(term)+'"><select id="showGenre">'+genres.map(g=>'<option '+(g===genre?'selected':'')+'>'+esc(g)+'</option>').join('')+'</select></div>':'')+'<h2>'+(mode==='home'?'Популярные сериалы':'')+'</h2><div class="grid">'+list.map(tile).join('')+'</div>'+(list.length?'':'<p class="muted">Ничего не найдено. Попробуй другой запрос.</p>')+'<p class="muted" style="font-size:12px;margin-top:35px">Данные и постеры: <a style="color:var(--accent)" href="https://www.tvmaze.com/" target="_blank" rel="noopener">TVmaze</a>. Просмотр полного видео не предоставляется.</p>';
if(mode==='home'||mode==='catalog'||mode==='favorites'){const tabs=document.createElement('div');tabs.style.cssText='display:flex;gap:8px;margin:0 0 24px';tabs.innerHTML='<button id="filmsTab">🎬 Фильмы</button><button class="active">📺 Сериалы</button>';const hero=app.querySelector('.hero');if(hero)hero.after(tabs);else app.prepend(tabs);tabs.querySelector('#filmsTab').onclick=()=>{filmMode=true;genre='Все';term='';loadFilms();draw()}}app.querySelectorAll('[data-show]').forEach(el=>el.onclick=()=>details(Number(el.dataset.show)));
if(app.querySelector('#browse'))app.querySelector('#browse').onclick=()=>{mode='catalog';draw()};
if(app.querySelector('#showSearch'))app.querySelector('#showSearch').oninput=e=>{term=e.target.value;const pos=e.target.selectionStart;draw();const n=app.querySelector('#showSearch');n.focus();n.setSelectionRange(pos,pos)};
if(app.querySelector('#showGenre'))app.querySelector('#showGenre').onchange=e=>{genre=e.target.value;draw()};
}
function details(id){const x=shows.find(x=>x.id===id);if(!x)return;const liked=favorites().includes(id);body.innerHTML='<div style="display:flex;gap:18px;align-items:start;flex-wrap:wrap"><img style="width:160px;max-width:40%;border-radius:12px" src="'+esc(x.image?.medium||'')+'" alt=""><div style="flex:1;min-width:180px"><h2>'+esc(x.name)+'</h2><p>★ '+(x.rating.average||'—')+' · '+esc(x.genres.join(' / '))+'</p><p>'+esc(x.premiered||'')+'</p></div></div><p style="line-height:1.7">'+esc(x.summary||'Описание отсутствует.')+'</p><button class="primary" id="showFav">'+(liked?'♥ В избранном':'♡ В избранное')+'</button> <a href="'+esc(x.url||'https://www.tvmaze.com/')+'" target="_blank" rel="noopener" style="color:var(--accent);margin-left:10px">Информация о сериале</a>';dialog.showModal();document.getElementById('showFav').onclick=()=>{let a=favorites();a=a.includes(id)?a.filter(v=>v!==id):[...a,id];localStorage.setItem('kadr-show-favs',JSON.stringify(a));dialog.close();draw()}}
async function load(){try{const ids=[82,169,73,431,123,83,335,2993,49,465,447,150,112,66,3353,536,527,618,2705,549];const results=await Promise.allSettled(ids.map(id=>fetch('https://api.tvmaze.com/shows/'+id).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));shows=results.filter(x=>x.status==='fulfilled').map(x=>x.value).filter(x=>x.image);if(!shows.length)throw Error('empty');draw()}catch(e){app.innerHTML='<h2>Каталог временно недоступен</h2><p class="muted">Проверь интернет и обнови страницу. IPTV остаётся доступным.</p><button id="retry">Повторить</button>';document.getElementById('retry').onclick=load}}
document.querySelectorAll('nav button').forEach((b,i)=>b.onclick=()=>{mode=['home','catalog','favorites','iptv','settings'][i];draw()});load();
})();
</script></body></html>
